name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck moteurs (src/lib)
        run: npm run typecheck:lib

      - name: Tests (calculs critiques)
        run: npm test

      - name: Build
        run: npm run build
